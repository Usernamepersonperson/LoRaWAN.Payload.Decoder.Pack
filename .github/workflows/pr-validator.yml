name: PR Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title and description
        env:
          # Passed via env, never interpolated into the script: PR titles and
          # bodies are attacker-controlled and would otherwise be evaluated
          # as shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TITLE="$PR_TITLE"
          BODY="$PR_BODY"
          
          # Verify PR title is not empty
          if [ -z "$TITLE" ]; then
            echo "❌ PR title is empty"
            exit 1
          fi
          
          # Verify PR description is not empty
          if [ -z "$BODY" ]; then
            echo "❌ PR description is empty"
            exit 1
          fi
          
          echo "✅ PR title and description present"

      - name: Check for Definition of Done compliance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking Definition of Done requirements..."
          
          # Basic checks
          if grep -q "## Testing" <<< "$PR_BODY"; then
            echo "✅ Testing section found"
          else
            echo "⚠️  No testing section in PR description"
          fi
          
          if grep -q "## Risk" <<< "$PR_BODY"; then
            echo "✅ Risk assessment found"
          else
            echo "⚠️  No risk assessment in PR description"
          fi
          
          if grep -q "## Rollback" <<< "$PR_BODY"; then
            echo "✅ Rollback plan found"
          else
            echo "⚠️  No rollback plan in PR description"
          fi

      - name: Run validation command
        id: validate
        continue-on-error: true
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh all

      - name: Check for protected files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking for changes to protected files..."
          git fetch origin "$BASE_REF"
          
          # Get list of changed files
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          
          # Check against protected list
          PROTECTED='docs/DO_NOT_TOUCH.md .github/copilot-instructions.md .vscode/settings.json'
          
          HAS_PROTECTED=false
          for file in $PROTECTED; do
            if echo "$CHANGED" | grep -q "^$file$"; then
              echo "⚠️ Changes to protected file: $file"
              HAS_PROTECTED=true
            fi
          done
          
          if [ "$HAS_PROTECTED" = "true" ]; then
            echo "❓ This PR touches protected files - human review required"
          else
            echo "✅ No protected files modified"
          fi

      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: |
          echo "❌ Validation failed"
          exit 1

      - name: Post validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const validationState = "${{ steps.validate.outcome }}" === "success" ? "✅ Passed" : "❌ Failed";
            const body = [
              "## 📋 PR Validation Report",
              "",
              "- **Title**: ✅ Present",
              "- **Description**: ✅ Present",
              "- **DoD Compliance**: ⚠️ Verify manually",
              `- **Validation**: ${validationState}`,
              "- **Protected Files**: ✅ No conflicts",
              "",
              "*Generated by PR Validator workflow*"
            ].join("\n");
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
